<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            margin: 0 0 1.5rem;
            color: #333;
            text-align: center;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .product {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .product label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }
        .product span {
            display: block;
            margin: 0.5rem 0;
            color: #555;
        }
        .product input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        button {
            background-color: #5469d4;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            opacity: 0.5; /* Inicia com o botão desabilitado */
            pointer-events: none; /* Desabilita interações */
            margin-top: 1rem; /* Espaço acima do botão */
        }
        button.enabled {
            opacity: 1; /* Habilita a visibilidade */
            pointer-events: auto; /* Permite interações */
        }
        button:hover {
            background-color: #4353b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selecione um produto</h1>
        <form id="product-form" action="payment.html" method="get">
            <div class="product-grid">
                <div class="product">
                    <label>
                        <input type="checkbox" name="amount" value="10.50"> Sol 🌟
                        <span>R$ 10,50</span>
                    </label>
                </div>
                <div class="product">
                    <label>
                        <input type="checkbox" name="amount" value="20.99"> Foguete 🚀
                        <span>R$ 20,99</span>
                    </label>
                </div>
                <div class="product">
                    <label>
                        <input type="checkbox" name="amount" value="30.99"> Mercado 🛒
                        <span>R$ 30,99</span>
                    </label>
                </div>
                <div class="product">
                    <label>
                        <input type="checkbox" name="amount" value="40.65"> Festa 🎉
                        <span>R$ 40,65</span>
                    </label>
                </div>
                <div class="product">
                    <label>
                        <input type="checkbox" name="amount" value="50000.99"> Diamante 💎
                        <span>R$ 50000,99</span>
                    </label>
                </div>
                <div class="product">
                    <label>
                        <input type="checkbox" name="amount" value="60.01"> Surpresa 🎁
                        <span>R$ 60,01</span>
                    </label>
                </div>
            </div>
            <button type="submit" id="submit-button" disabled>Continuar para Pagamento</button>
        </form>
    </div>
    <script>
        // Função para habilitar/desabilitar o botão
        function toggleSubmitButton() {
            const button = document.getElementById('submit-button');
            const checkboxes = document.querySelectorAll('input[name="amount"]');
            const anyChecked = Array.from(checkboxes).some(checkbox => checkbox.checked);
            button.disabled = !anyChecked;
            if (anyChecked) {
                button.classList.add('enabled');
            } else {
                button.classList.remove('enabled');
            }
        }

        // Adiciona listeners aos checkboxes
        document.querySelectorAll('input[name="amount"]').forEach(checkbox => {
            checkbox.addEventListener('change', toggleSubmitButton);
        });

        // Inicializa o estado do botão na carga da página
        toggleSubmitButton();
    </script>
</body>
</html>
